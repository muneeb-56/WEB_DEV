<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>

    <style>
       .container{
        border: 2px solid rgb(154, 11, 11);
        display: grid;
        grid-template-columns: [fcol] 120px [scol] 100px;
        grid-template-rows: [frow] 100px [srow] 100px [trow] 100px;
       }

       .item{
        border: 2px solid rgb(33, 139, 10);
        border-radius: 10px;
        height: 55px;
        width: 55px;
       }

       .item1{
        grid-row: frow/2;
        grid-column: 1/scol;
       }

       .item4{
        grid-row: 1/2;
        grid-column: 1/2;
       }
    </style>
</head>

<body>

    <div class="container">
        <div class="item item1">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item item4">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>

</body>

</html>
