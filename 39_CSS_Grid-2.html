<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>

    <style>
       .container{
        border: 2px solid rgb(154, 11, 11);
        display: grid;
        height: 50vh;
        /* grid-template-areas: "nav nav nav"
                             "side article article"
                             "footer footer footer"
                             ; */

        grid-template-columns: 1fr 2fr 3fr 1fr;
        /* grid-template-rows: repeat(4, 2fr); */
        grid-template-rows: repeat(4, minmax(1fr, 5fr));
        row-gap: 5px;
        column-gap: 20px;
        /* justify-items: center; */
        align-items: center;

       }

       .item{
        border: 2px solid rgb(33, 139, 10);
        border-radius: 10px;
        
       }

       }
       .item3{
        grid-area: article;

       }
       .item4{
        grid-area: footer;
        background-color: black;
       } */

       /* overlap */
       /* .item5{
        grid-area: nav;   
       } */


    </style>
</head>

<body>

    <div class="container">
        <div class="item item1">1</div>
        <div class="item item2">2</div>
        <div class="item item3">3</div>
        <div class="item item4">4</div>
